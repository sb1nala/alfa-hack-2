services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa_local}
      POSTGRES_DB: alfa
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://alfa:${POSTGRES_PASSWORD:-alfa_local}@db:5432/alfa
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  db_data:
