# Налоговый календарь для напоминаний: обязательные платежи и отчёты малого бизнеса.
# Период: с 12.11.2026 по 31.12.2027. Прошедшие сроки 2026 года не включены — напоминать о них поздно.
#
# Как читать:
#   regimes   — значения UserProfile.tax_regime, для которых событие имеет смысл
#   who       — значения UserProfile.legal_form
#   kind      — payment (заплатить) или report (сдать отчёт или уведомление)
#   text      — готовая фраза для напоминания
#   rule      — правило простыми словами; law — норма; source — страница, по которой сверено
#   search_hint — запрос для kb.search(), чтобы приложить материал «как это сделать»
#   dates     — due: срок с учётом переноса с выходных и праздников (п. 7 ст. 6.1 НК РФ);
#               nominal: дата по закону; period: за что платим или отчитываемся
#   frequency: relative — срок считается от дат патента пользователя, списка dates нет
#
# Чего в календаре нет: отчётов и платежей за сотрудников (НДФЛ, взносы, РСВ, 6-НДФЛ, ЕФС-1),
# НДС для упрощёнки с доходом выше порога, торгового сбора, налога на имущество, сумм платежей.
#
# Статус проверки: правила сверены со страницами ФНС из поля source 2026-11-12. Даты посчитаны
# по этим правилам; переносы выходных 2027 года взяты из публикаций о постановлении
# Правительства от 17.09.2026 № 1187. Номера пунктов в поле law с текстом НК РФ не сверялись.
# Перед сдачей каждую дату и норму по первоисточнику сверяет человек.

